[project]
name = "thursday"
version = "0.2.0"
description = "Thursday - Local-first AI assistant with optional cloud LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "speechrecognition>=3.10.0",
    "edge-tts>=6.1.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["assistant*"]

[project.optional-dependencies]
voice = [
    "PyAudio>=0.2.14",
]
desktop = [
    "psutil>=5.9.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
all = [
    "thursday[voice,desktop,dev]",
]

[project.scripts]
thursday = "assistant.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "B", "C4", "T20", "PT", "PTH", "ARG", "SIM", "RET", "TRY", "FURB", "NPY", "PD", "PLC", "RSE", "RUF", "TCH", "INT", "PERF", "FA"]
ignore = ["SIM103", "SIM117", "PTH123", "T201", "T203"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["assistant/tests"]
pythonpath = ["."]
